html,body{

button,input{font:inherit}

.app{

.brand{

.logo{

.loginBtn,.primary{

.notice{

.notice b{

.notice span{

.notice i{

.banner{

 border-radius:8px;

 background:linear-gradient(135deg,#066d9d,#0ab0d3);

 color:#fff;
 padding:15px

.banner:after{
 content:"";
 position:absolute;
 right:-20px;
 top:-35px;

 height:150px;

 background:#fff2
}

.banner h2{
 margin:8px 0 2px;

.banner p{

 z-index:2

.banner .mini{

.dots{

.dot{

.dot.active{

.actions{

.action{

.sectionTitle{

.offerGrid{

.offer{

.game small{

.pkgGrid{

.pkg{

.pkg small{

.step{

.num{

 height:21px;

 color:#fff;

 place-items:center;

label{

input{

.payGrid{

 font-size:11px;
 font-weight:800
}

.pay.selected{

.summary{
 background:#f7fbfd;

 padding:10px;
 font-size:11px;

}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(520px,100%);
 height:67px;
 background:#fff;
 border-top:1px solid #dce7ec;
 display:grid;
 grid-template-columns:repeat(5,1fr);

}

.nav{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 font-size:9px;
 color:#657681;
 gap:3px
}

.nav .ico{
 font-size:18px
}

.nav.active{

}

.add{

 height:42px;

 background:var(--blue);
 color:#fff;
 font-size:25px;
 display:grid;
 place-items:center;
 margin-top:-17px;
 border:4px solid #fff;
 box-shadow:0 2px 8px #0002
}

.float{

 bottom:82px;
 width:42px;
 height:42px;

 background:var(--blue);
 color:#fff;
 display:grid;
 place-items:center;

 box-shadow:0 2px 10px #0003

.modal{

 inset:0;
 background:#0008;
 display:none;
 align-items:flex-end;
 justify-content:center;
 z-index:80
}

.modal.show{
 display:flex
}

.sheet{
 width:min(520px,100%);
 background:#fff;
 border-radius:14px 14px 0 0;
 padding:16px;

 overflow:auto
}

.sheet h3{
 text-align:center;
 margin:2px 0 12px
}

.close{

 height:28px;
 background:#eef4f7
}

.noticePop{

}

.noticePop .blue{
 display:inline-block;

 color:#fff;

.toast{

 top:70px;
 left:50%;
 transform:translateX(-50%);

 padding:9px 13px;

 display:none;

}

.toast.show{

.back{
 display:inline-flex;
 align-items:center;
 gap:5px;

.bkash{
 background:linear-gradient(180deg,#d71975,#c91868);

.bkash h2{

.bkash input{

}

.bkash li{

.order{

.status{

 background:#fff4d8;
 color:#9a6800;
 font-size:9px;

}

@media(min-width:700px){
 body{background:#dfe8ed}
 .app{min-height:100vh}
}
</style>
</head>

<body>

<div class="app">

 <div class="brand">

</header>

 class="modal"
 onclick="if(event.target.id==='modal')closeModal()">

 <div class="sheet" id="sheet"></div>

</div>

<div id="toast" class="toast"></div>

<script>

const PACKAGES=[
 ["Weekly",158],
 ["Monthly",782],
 ["25 Diamond",22],
 ["50 Diamond",37],
 ["115 Diamond",80],
 ["240 Diamond",158],
 ["355 Diamond",236],
 ["480 Diamond",317],
 ["505 Diamond",337],
 ["610 Diamond",402],
 ["850 Diamond",560],
 ["1090 Diamond",718],
 ["1240 Diamond",802],
 ["1850 Diamond",1202],
 ["2090 Diamond",1360],
 ["2530 Diamond",1612],
 ["4010 Diamond",2568],
 ["5060 Diamond",3220],
 ["7590 Diamond",4830],
 ["10120 Diamond",6440],
 ["12650 Diamond",8050]
];

let state=JSON.parse(
 localStorage.getItem("agbd_state")||"null"
)||{
 user:{
  name:"Aryan Islam",
  email:"",
  pin:"259465",
  verified:true
 },
 wallet:0,
 orders:[],
 codes:[],
 selected:null,
 uid:"",
 pay:"Wallet Pay"
};

function save(){
 localStorage.setItem(
  "agbd_state",
  JSON.stringify(state)
 )
}

function money(n){
 return "BDT "+Number(n).toLocaleString("en-US")
}

function toast(t){
 const x=document.getElementById("toast");
 x.textContent=t;
 x.classList.add("show");

 setTimeout(
  ()=>x.classList.remove("show"),
  1800
 )
}

function openModal(html){
 document.getElementById("sheet").innerHTML=html;
 document.getElementById("modal").classList.add("show")
}

function closeModal(){
 document.getElementById("modal").classList.remove("show")
}

function openLogin(){

 openModal(`
 <button class="close"
 onclick="closeModal()">×</button>

 <div class="card profile">

 <div style="font-size:11px;color:#159bc4;font-weight:800">
 SECURE ACCOUNT ACCESS
 </div>

 <h2 style="margin:8px 0 0">
 Welcome<br>
 <span style="color:#159bc4">Back</span>
 </h2>

 <p class="muted">
 Fast, secure and simple account access.
 </p>

 <div class="card">
 <b>🔐 Sign in to continue</b>
 </div>

 <button class="full"
 onclick="demoGoogle()">
 🌈 Continue with Google
 </button>

 <label>Email address</label>
 <input
 id="email"
 type="email"
 placeholder="Enter your email">

 <label>Password</label>
 <input
 id="pass"
 type="password"
 placeholder="Enter your password">

 <button
 class="full"
 style="margin-top:10px"
 onclick="loginEmail()">
 ↪ Sign in
 </button>

 <p
 class="muted"
 style="margin-top:10px">

 </p>

 </div>
 `)
}

function demoGoogle(){

 state.user.email="google-user@example.com";
 state.user.name="Aryan Islam";

 save();
 closeModal();

 toast("Google demo login complete");

 render("account")
}

function loginEmail(){

 let e=document
 .getElementById("email")
 .value
 .trim();

 if(!e){
  toast("Email দিন");
  return
 }

 state.user.email=e;

 save();
 closeModal();

 toast("Login complete");

 render("account")
}

 return `

  <i class="dot"></i>

 <div class="actions">

  <button

  onclick="window.open('https://facebook.com/','_blank')">

  </button>

  <button
  class="action"

  </button>

 </div>

 </div>

  <div class="offer">

  </div>

  <div class="offer">

  </div>

 <div

  <b>🎁 Free 25 Diamond Voucher</b>

  <div class="muted">

  </div>

 </div>

 <div class="gameGrid">

function game(icon,name,action){

 return `
 <button
 class="game"
 onclick="go('${action}')">

  <div class="gameArt">
   ${icon}
  </div>

  <small>
   ${name}
  </small>

 </button>
 `

function topup(){

 return `
 <div class="page">

 <button
 class="back"
 onclick="go('home')">
 ← Back
 </button>

 <div class="card">

  <div class="step">
   <span class="num">1</span>
   Select Package
  </div>

  <div
  class="pkgGrid"
  style="margin-top:8px">

   ${PACKAGES.map(
    (p,i)=>`

    <button
    class="pkg ${
     state.selected &&
     state.selected[0]===p[0]
     ?'selected':''
    }"
    onclick="selectPkg(${i})">

     ${p[0]}

     <small>
      ${money(p[1])}
     </small>

    </button>

   `).join("")}

  </div>

 </div>

 <div class="card">

  <div class="step">
   <span class="num">2</span>
   Account Info
  </div>

  <label>
   আপনার গেমের UID / Player ID দিন
  </label>

  <input
   id="uid"
   value="${state.uid||""}"
   inputmode="numeric"
   placeholder="আপনার UID লিখুন">

  <button
   class="full"
   style="margin-top:7px"
   onclick="setUid()">

   আপনার গেম আইডি সঠিক কিনা চেক করুন

  </button>

 </div>

 <div class="card">

  <div class="step">
   <span class="num">3</span>
   Select one option
  </div>

  <div
  class="payGrid"
  style="margin-top:8px">

   <button
   class="pay ${
    state.pay==='Wallet Pay'
    ?'selected':''
   }"
   onclick="setPay('Wallet Pay')">

    💼 Wallet Pay

   </button>

   <button
   class="pay ${
    state.pay==='Instant Pay'
    ?'selected':''
   }"
   onclick="setPay('Instant Pay')">

    💳 Instant Pay

   </button>

  </div>

  <div
  class="summary"
  style="margin-top:9px">

   Package:
   <b>
    ${state.selected
     ?state.selected[0]
     :"Not selected"}
   </b>

   <br>

   Price:
   <b>
    ${state.selected
     ?money(state.selected[1])
     :"—"}
   </b>

   <br>

   UID:
   <b>
    ${state.uid||"—"}
   </b>

  </div>

  <button
  class="full"
  style="margin-top:9px"
  onclick="buyNow()">

   BUY NOW

  </button>

 </div>

 </div>
 `
}

function selectPkg(i){

 state.selected=PACKAGES[i];

 save();

 render("topup")
}

function setUid(){

 const v=document
 .getElementById("uid")
 .value
 .trim();

 if(!v){
  toast("UID দিন");
  return
 }

 state.uid=v;

 save();

 toast("UID saved");

 render("topup")
}

function setPay(p){

 state.pay=p;

 save();

 render("topup")
}

function buyNow(){

 if(!state.selected){
  toast("একটি package নির্বাচন করুন");
  return
 }

 if(!state.uid){
  toast("UID দিন");
  return
 }

 if(state.pay==="Wallet Pay"){

  if(state.wallet<state.selected[1]){

   toast("Wallet balance যথেষ্ট নয়");

   go("add");

   return
  }

  completeOrder("Wallet Pay")

 }else{

  openPayment()

 }
}

function openPayment(){

 const price=state.selected[1];

 openModal(`

 <button
 class="close"
 onclick="closeModal()">
 ×
 </button>

 <div class="bkash">

  <h2>bKash</h2>

  <div
  style="
  background:#fff;
  color:#333;
  border-radius:7px;
  padding:10px;
  margin-bottom:9px">

   🏪 Payment
   <br>

   <b>
    ${money(price)}
   </b>

function submitBkash(){

 .getElementById("trx")
 .value

 completeOrder("bKash",trx)
}

function completeOrder(method,trx=""){

 const p=state.selected;

 if(method==="Wallet Pay"){
  state.wallet-=p[1]
 }

 const order={
  id:"AG"+Date.now().toString().slice(-8),
  package:p[0],
  price:p[1],
  uid:state.uid,
  method,
  trx,
  status:
   method==="Wallet Pay"
   ?"Processing"
   :"Payment Submitted",
  date:new Date().toLocaleString("en-BD")
 };

 state.orders.unshift(order);

 state.selected=null;

 save();

 openModal(`

 <div class="noticePop">

  <div style="font-size:42px">
   ✅
  </div>

  <h3>
   Order Submitted
  </h3>

  <p class="muted">
   Order ID:
   <b>${order.id}</b>
  </p>

  <p>
   ${order.package}
   <br>
   ${money(order.price)}
  </p>

  <span class="status">
   ${order.status}
  </span>

  <br>

  <button
  class="primary"
  style="margin-top:12px"
  onclick="closeModal();go('orders')">

   View My Orders

  </button>

 </div>

 `)
}

  :page==="contact"
  ?contact()
  :home();

 document.getElementById("content")
 .innerHTML=html;

 document.querySelectorAll(".nav")
 .forEach(
  n=>n.classList.toggle(
   "active",
   n.dataset.page===page
  )
 );

 });
}
